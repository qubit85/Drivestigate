name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt '.[documents,dev]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check drivestigate/static/app.js
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
