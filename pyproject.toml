[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivestigate"
version = "1.5.0"
description = "Investigate your drives. Rediscover what matters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6.0,<7", "Pillow>=11.0,<13"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
drivestigate = "drivestigate.server:main"

[tool.setuptools.package-data]
drivestigate = ["static/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
